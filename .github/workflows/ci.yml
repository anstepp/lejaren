name: tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov coverage-badge
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run pytest and generate badge
        run: |
          pytest --cov=./lejaren
          mkdir -p public
          coverage-badge -o public/coverage.svg -f

      - name: Deploy badge to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

  run-pytest:
    strategy:
      fail-fast: false
      matrix:
        python-version: [3.14]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Setup poetry
        uses: abatilo/actions-poetry@v2.0.0
        with:
          poetry-version: 2.4.1
      - name: Run poetry install
        run: poetry install
      - name: Run pytest
        run: poetry run pytest tests/
