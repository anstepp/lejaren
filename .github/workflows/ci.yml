name: tests
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: abatilo/actions-poetry@v2.0.0
        with:
          poetry-version: 2.4.1
      - run: |
          poetry install
          poetry run pip install pytest-cov
      - run: poetry run pytest tests/ --cov=lejaren --cov-report=term-missing
