[tool.poetry]
name = "lejaren"
version = "1.5.3"
description = "Computer-Aided Musical Prototyping using Python"
authors = ["Aaron Stepp <stepp.aaron@gmail.com>"]
readme = "README.md"
license = "GPL-3.0-only"

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
lxml = "^6.1.1"
numpy = "^2.4.0"
scipy = "^1.18.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-cov = "^7.1.0"
coverage-badge = "^1.1.2"

[tool.coverage.run]
source = ["lejaren"]

[tool.pytest.ini_options]
addopts = "--cov=lejaren/notation --cov-report=term-missing"


[build-system]
requires = ["poetry>=2.0.0"]
build-backend = "poetry.masonry.api"
