[tool.poetry]
name = "lejaren"
version = "1.0.0"
description = "Computer-Aided Musical Prototyping using Python"
authors = ["Aaron Stepp <stepp.aaron@gmail.com>"]
readme = "README.md"
license = "GPL-3.0-only"

[tool.poetry.dependencies]
python = ">=3.14,<4.0"
lxml = "^6.1.1"
numpy = "^2.4.0"
scipy = "^1.18.0"

[tool.poetry.group.dev.dependencies]
pytest = "*"


[build-system]
requires = ["poetry>=2.0.0"]
build-backend = "poetry.masonry.api"
